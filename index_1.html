<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭菜单小程序</title>
<style>
:root{--ink:#3f3a32;--paper:#fffdf7;--line:#bcd4e6;--red:#dd756b;--green:#789c79;--yellow:#f3c96a;--shadow:0 8px 22px #6d5d4830}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Comic Sans MS","KaiTi","STKaiti",system-ui,sans-serif;background:#eee2ca;background-image:linear-gradient(90deg,transparent 48px,#e7aaa4 49px,#e7aaa4 51px,transparent 52px),repeating-linear-gradient(#0000 0 31px,var(--line) 32px),radial-gradient(#fff8 1px,transparent 1px);background-size:auto,auto,18px 18px;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;padding:26px 26px 80px 72px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:24px}.eyebrow{font-size:13px;letter-spacing:3px;color:#8c7e6d}.title{font-size:clamp(34px,5vw,62px);line-height:1;margin:7px 0 9px;transform:rotate(-1deg)}.subtitle{margin:0;color:#766c60}.date-note{background:#fff2a7;padding:16px 22px;box-shadow:var(--shadow);transform:rotate(2deg);min-width:180px;text-align:center;position:relative}.date-note:before,.tape{content:"";position:absolute;width:72px;height:22px;background:#b9d8c8bb;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg)}.date-note b{display:block;font-size:20px;margin-top:2px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 25px}.btn{border:2px solid var(--ink);background:var(--paper);padding:10px 15px;border-radius:7px;box-shadow:3px 3px 0 var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:7px}.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.btn.primary{background:var(--yellow)}.btn.green{background:#cfe2c7}.btn.red{background:#f2b0a7}.filters{display:grid;grid-template-columns:1fr 150px 150px;gap:10px;margin-bottom:20px}.field{width:100%;border:2px solid #7a7064;border-radius:7px;background:#fffdf7;padding:11px 13px;outline:none}.field:focus{box-shadow:0 0 0 3px #f3c96a77}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:4px;padding:10px;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));transition:.2s;overflow:hidden}.card:nth-child(3n+1){--tilt:-.55deg}.card:nth-child(3n+2){--tilt:.45deg}.card:hover{transform:translateY(-3px) rotate(0);box-shadow:0 13px 26px #6d5d4840}.card.selected{outline:5px solid #f0c65d99}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border:1.5px solid var(--ink);display:block;background:#e9dec6}.check{position:absolute;top:17px;right:17px;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:bold;z-index:2}.selected .check{background:var(--green);color:white}.card-body{padding:10px 4px 4px}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.card h3{font-size:20px;margin:0}.tag{white-space:nowrap;background:#f6dda3;padding:3px 8px;border-radius:3px;font-size:12px;transform:rotate(1deg)}.meta{font-size:13px;color:#776d61;margin:8px 0;line-height:1.55}.actions{display:flex;gap:7px}.mini{border:1.5px solid var(--ink);background:white;border-radius:5px;padding:5px 9px;font-size:12px}.board{position:sticky;top:20px;background:#fff7b9;border:2px solid var(--ink);box-shadow:var(--shadow);padding:24px 20px 20px;transform:rotate(.4deg);min-height:390px}.board:before{content:"";position:absolute;width:100px;height:24px;left:50%;top:-13px;transform:translateX(-50%) rotate(-2deg);background:#e9a7a0aa}.board h2{margin:0 0 5px;font-size:27px}.board .hint{font-size:13px;color:#7a6f62;margin:0 0 17px}.menu-list{display:grid;gap:10px}.menu-item{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#fffdf4;border:1.5px dashed #746b61;padding:7px}.menu-item img{width:42px;height:42px;object-fit:cover;border-radius:50%}.menu-item b{font-size:15px}.empty{text-align:center;padding:45px 8px;color:#8d8172}.empty .bowl{font-size:52px;display:block}.board-footer{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.count{display:inline-block;background:#ef8e82;color:white;border-radius:50%;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:13px}.modal{position:fixed;inset:0;background:#322d285f;display:none;place-items:center;padding:20px;z-index:10}.modal.open{display:grid}.dialog{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:3px solid var(--ink);box-shadow:9px 9px 0 #3f3a32;padding:24px;position:relative}.dialog h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .wide{grid-column:1/-1}.label{display:block;font-size:13px;margin-bottom:5px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:#3f3a32;color:white;padding:11px 18px;border-radius:6px;z-index:20;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.share-banner{display:none;background:#d8ebd3;border:2px dashed #587257;padding:13px 16px;margin-bottom:18px}.share-banner.show{display:flex;justify-content:space-between;gap:15px;align-items:center}.no-results{grid-column:1/-1;text-align:center;padding:70px 10px;color:#817566}@media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.board{position:relative;top:auto}}@media(max-width:620px){.app{padding:20px 14px 90px 42px}.top{align-items:start}.date-note{display:none}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.title{font-size:39px}.board-footer{grid-template-columns:1fr}.btn{padding:9px 12px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div><div class="eyebrow">OUR FAMILY KITCHEN</div><h1 class="title">今天吃什么？</h1><p class="subtitle">把喜欢的家常味，贴进今天的小菜单里。</p></div><div class="date-note">今日菜单计划<b id="today"></b></div></header>
  <div id="shareBanner" class="share-banner"><span>你正在查看朋友分享的菜单，可继续调整并保存到自己的浏览器。</span><button class="mini" onclick="dismissShare()">知道啦</button></div>
  <nav class="toolbar" aria-label="菜单操作">
    <button class="btn primary" onclick="openForm()">＋ 新增菜谱</button><button class="btn" onclick="randomPick()">🎲 随机点一道</button><button class="btn green" onclick="generateMenu()">✦ 生成今日菜单</button><button class="btn" onclick="shareMenu()">🔗 分享当前菜单</button><button class="btn red" onclick="clearMenu()">清空勾选</button>
  </nav>
  <section class="filters"><input id="search" class="field search" placeholder="搜索菜名或食材…" oninput="render()"><select id="category" class="field" onchange="render()"><option value="">全部分类</option><option>荤菜</option><option>素菜</option><option>汤羹</option><option>主食</option></select><select id="difficulty" class="field" onchange="render()"><option value="">全部难度</option><option>简单</option><option>普通</option><option>进阶</option></select></section>
  <div class="layout"><section><div id="recipeGrid" class="grid"></div></section><aside class="board"><h2>今日菜单 <span id="count" class="count">0</span></h2><p class="hint">勾选菜谱，搭配属于今天的一餐</p><div id="menuList" class="menu-list"></div><div class="board-footer"><button class="btn green" onclick="generateMenu()">重新搭配</button><button class="btn" onclick="shareMenu()">复制分享链接</button></div></aside></div>
</main>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle" onclick="if(event.target===this)closeForm()"><form id="recipeForm" class="dialog" onsubmit="saveRecipe(event)"><h2 id="formTitle">新增菜谱</h2><input id="editId" type="hidden"><div class="form-grid"><label><span class="label">菜名 *</span><input id="name" class="field" required maxlength="30"></label><label><span class="label">分类</span><select id="formCategory" class="field"><option>荤菜</option><option>素菜</option><option>汤羹</option><option>主食</option></select></label><label><span class="label">难度</span><select id="formDifficulty" class="field"><option>简单</option><option>普通</option><option>进阶</option></select></label><label><span class="label">图片网址（可选）</span><input id="image" class="field" type="url" placeholder="https://..."></label><label class="wide"><span class="label">食材（用顿号或逗号分隔） *</span><textarea id="ingredients" class="field" rows="3" required></textarea></label></div><div class="dialog-actions"><button type="button" class="btn" onclick="closeForm()">取消</button><button class="btn primary" type="submit">保存菜谱</button></div></form></div>
<div id="toast" class="toast"></div>
<script>
const STORAGE='family-menu-recipes-v4';const SELECTED='family-menu-selected-v4';
const art=(name,color='#e8d6bd')=>`data:image/svg+xml;charset=utf-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><rect width="640" height="480" fill="${color}"/><circle cx="320" cy="228" r="160" fill="#fff9ed" stroke="#4b4035" stroke-width="8"/><ellipse cx="320" cy="228" rx="125" ry="96" fill="#d68c55"/><text x="320" y="410" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#4b4035">${name}</text></svg>`)}`;
const defaults=[
{id:'r1',name:'番茄炒蛋',category:'素菜',difficulty:'简单',ingredients:'番茄、鸡蛋、小葱',image:''},
{id:'r2',name:'宫保鸡丁',category:'荤菜',difficulty:'普通',ingredients:'鸡胸肉、花生、辣椒、黄瓜',image:''},
{id:'r3',name:'红烧肉',category:'荤菜',difficulty:'进阶',ingredients:'五花肉、冰糖、生抽、香料',image:''},
{id:'r4',name:'麻婆豆腐',category:'荤菜',difficulty:'普通',ingredients:'豆腐、肉末、豆瓣酱、花椒',image:''},
{id:'r5',name:'青椒肉丝',category:'荤菜',difficulty:'普通',ingredients:'猪里脊、青椒、姜蒜',image:''},
{id:'r6',name:'鱼香茄子',category:'素菜',difficulty:'普通',ingredients:'茄子、泡椒、葱姜蒜',image:''},
{id:'r7',name:'蒜蓉西兰花',category:'素菜',difficulty:'简单',ingredients:'西兰花、大蒜、蚝油',image:''},
{id:'r8',name:'可乐鸡翅',category:'荤菜',difficulty:'简单',ingredients:'鸡翅、可乐、生抽、姜',image:''},
{id:'r9',name:'香菇炒青菜',category:'素菜',difficulty:'简单',ingredients:'青菜、香菇、蒜',image:''},
{id:'r10',name:'土豆炖牛肉',category:'荤菜',difficulty:'进阶',ingredients:'牛肉、土豆、胡萝卜、洋葱',image:''},
{id:'r11',name:'紫菜蛋花汤',category:'汤羹',difficulty:'简单',ingredients:'紫菜、鸡蛋、虾皮、葱花',image:''},
{id:'r12',name:'扬州炒饭',category:'主食',difficulty:'普通',ingredients:'米饭、鸡蛋、火腿、豌豆',image:''}];
let recipes=load(STORAGE,defaults).map(r=>{const fresh=defaults.find(d=>d.id===r.id);return fresh?{...r,image:fresh.image}:r}),selected=load(SELECTED,[]);let shared=false;
window.applyMenuImages=function(){if(!Array.isArray(window.MENU_IMAGES)||window.MENU_IMAGES.length!==defaults.length)return;defaults.forEach((r,i)=>r.image=window.MENU_IMAGES[i]);recipes=recipes.map(r=>{const i=defaults.findIndex(d=>d.id===r.id);return i<0?r:{...r,image:window.MENU_IMAGES[i]}});render()};
function load(k,f){try{const x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:f}catch{return f}}
function persist(){localStorage.setItem(STORAGE,JSON.stringify(recipes));localStorage.setItem(SELECTED,JSON.stringify(selected))}
function safe(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function imageFor(r){return r.image&&r.image!=='undefined'?r.image:art(r.name)}
function render(){const q=document.querySelector('#search').value.trim().toLowerCase(),cat=document.querySelector('#category').value,diff=document.querySelector('#difficulty').value;const list=recipes.filter(r=>(!q||(r.name+r.ingredients).toLowerCase().includes(q))&&(!cat||r.category===cat)&&(!diff||r.difficulty===diff));document.querySelector('#recipeGrid').innerHTML=list.length?list.map(r=>`<article class="card ${selected.includes(r.id)?'selected':''}"><button class="check" aria-label="${selected.includes(r.id)?'取消':'选择'}${safe(r.name)}" onclick="toggle('${r.id}')">${selected.includes(r.id)?'✓':''}</button><img class="photo" src="${safe(imageFor(r))}" alt="${safe(r.name)}" onerror="this.src=art('${safe(r.name)}')"><div class="card-body"><div class="card-top"><h3>${safe(r.name)}</h3><span class="tag">${safe(r.category)}</span></div><p class="meta">难度：${safe(r.difficulty)}<br>食材：${safe(r.ingredients)}</p><div class="actions"><button class="mini" onclick="openForm('${r.id}')">编辑</button><button class="mini" onclick="deleteRecipe('${r.id}')">删除</button></div></div></article>`).join(''):'<div class="no-results">没有找到合适的菜谱，换个关键词试试吧。</div>';renderMenu()}
function renderMenu(){const items=selected.map(id=>recipes.find(r=>r.id===id)).filter(Boolean);document.querySelector('#count').textContent=items.length;document.querySelector('#menuList').innerHTML=items.length?items.map(r=>`<div class="menu-item"><img src="${safe(imageFor(r))}" alt=""><b>${safe(r.name)}</b><button class="mini" aria-label="移除${safe(r.name)}" onclick="toggle('${r.id}')">×</button></div>`).join(''):'<div class="empty"><span class="bowl">🍲</span>菜单还是空的<br>从左边勾几道菜吧</div>'}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];persist();render()}
function randomPick(){if(!recipes.length)return toast('菜谱库还是空的');const pool=recipes.filter(r=>!selected.includes(r.id)),r=(pool.length?pool:recipes)[Math.floor(Math.random()*(pool.length||recipes.length))];if(!selected.includes(r.id))selected.push(r.id);persist();render();toast(`今天试试「${r.name}」`)}
function sample(a){return a[Math.floor(Math.random()*a.length)]}
function generateMenu(){if(!recipes.length)return toast('先添加几道菜谱吧');const meat=recipes.filter(r=>r.category==='荤菜'),veg=recipes.filter(r=>r.category==='素菜'),other=recipes.filter(r=>['汤羹','主食'].includes(r.category));const picks=[meat.length&&sample(meat),veg.length&&sample(veg),other.length&&sample(other)].filter(Boolean);while(picks.length<Math.min(3,recipes.length)){const r=sample(recipes);if(!picks.some(x=>x.id===r.id))picks.push(r)}selected=[...new Set(picks.map(r=>r.id))];persist();render();toast('今日菜单搭配好啦')}
function clearMenu(){selected=[];persist();render();toast('已清空今日菜单')}
function openForm(id=''){const r=recipes.find(x=>x.id===id);document.querySelector('#recipeForm').reset();document.querySelector('#editId').value=r?.id||'';document.querySelector('#formTitle').textContent=r?'编辑菜谱':'新增菜谱';if(r){document.querySelector('#name').value=r.name;document.querySelector('#formCategory').value=r.category;document.querySelector('#formDifficulty').value=r.difficulty;document.querySelector('#ingredients').value=r.ingredients;document.querySelector('#image').value=(r.image||'').startsWith('data:')?'':r.image||''}document.querySelector('#modal').classList.add('open');setTimeout(()=>document.querySelector('#name').focus(),50)}
function closeForm(){document.querySelector('#modal').classList.remove('open')}
function saveRecipe(e){e.preventDefault();const id=document.querySelector('#editId').value;const data={id:id||'u'+Date.now(),name:document.querySelector('#name').value.trim(),category:document.querySelector('#formCategory').value,difficulty:document.querySelector('#formDifficulty').value,ingredients:document.querySelector('#ingredients').value.trim(),image:document.querySelector('#image').value.trim()};if(id)recipes=recipes.map(r=>r.id===id?data:r);else recipes.unshift(data);persist();closeForm();render();toast(id?'菜谱已更新':'新菜谱已收进菜谱库')}
function deleteRecipe(id){const r=recipes.find(x=>x.id===id);if(!r||!confirm(`确定删除「${r.name}」吗？`))return;recipes=recipes.filter(x=>x.id!==id);selected=selected.filter(x=>x!==id);persist();render();toast('菜谱已删除')}
function copyText(value){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(value);const box=document.createElement('textarea');box.value=value;box.style.position='fixed';box.style.opacity='0';document.body.appendChild(box);box.select();const ok=document.execCommand('copy');box.remove();return ok?Promise.resolve():Promise.reject()}
function shareMenu(){const items=selected.map(id=>recipes.find(r=>r.id===id)).filter(Boolean).map(({id,name,category,difficulty,ingredients,image})=>({id,name,category,difficulty,ingredients,image:image&&image.startsWith('data:')?'':image}));if(!items.length)return toast('先勾选几道菜再分享吧');const data=btoa(unescape(encodeURIComponent(JSON.stringify(items))));const url=`${location.origin}${location.pathname}?menu=${encodeURIComponent(data)}`;copyText(url).then(()=>toast('分享链接已复制')).catch(()=>{prompt('复制这条分享链接：',url)})}
function readShare(){const p=new URLSearchParams(location.search).get('menu');if(!p)return;try{const items=JSON.parse(decodeURIComponent(escape(atob(p))));if(Array.isArray(items)&&items.length){items.forEach(x=>{if(!recipes.some(r=>r.id===x.id))recipes.push(x)});selected=items.map(x=>x.id);shared=true;document.querySelector('#shareBanner').classList.add('show');persist()}}catch{toast('分享链接内容无法读取')}}
function dismissShare(){document.querySelector('#shareBanner').classList.remove('show')}
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});document.querySelector('#today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(new Date());readShare();render();const imageScript=document.createElement('script');imageScript.src='images.js';imageScript.async=true;document.body.appendChild(imageScript);
</script>
</body>
</html>
